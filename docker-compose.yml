services:
  portal:
    build: .
    container_name: raptors_dogfood_portal
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DOGFOOD_DB_PATH=/app/data/dogfood.db
      - SECRET_KEY=dogfood_hackathon_raptors_secret_2026
    volumes:
      - ./data:/app/data
    restart: unless-stopped
